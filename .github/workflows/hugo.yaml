name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      HUGO_VERSION: "0.163.3"
      GOPRIVATE: github.com/HatFullOfData/*
      HUGO_ENVIRONMENT: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check private module credential
        env:
          SHARED_MODULE_TOKEN: ${{ secrets.HUGO_SHARED_MODULE_TOKEN }}
        run: |
          if [[ -z "$SHARED_MODULE_TOKEN" ]]; then
            echo "::error::Set the HUGO_SHARED_MODULE_TOKEN repository secret to a token with read access to hatfullofdata-hugo-shared."
            exit 1
          fi

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Hugo Extended
        run: |
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl --fail --silent --show-error --location "$release/$archive" --output "$RUNNER_TEMP/$archive"
          curl --fail --silent --show-error --location "$release/hugo_${HUGO_VERSION}_checksums.txt" --output "$RUNNER_TEMP/hugo-checksums.txt"
          cd "$RUNNER_TEMP"
          grep " ${archive}$" hugo-checksums.txt | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/hugo"
          tar -xzf "$archive" -C "$RUNNER_TEMP/hugo" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"

      - name: Build production site
        env:
          SHARED_MODULE_TOKEN: ${{ secrets.HUGO_SHARED_MODULE_TOKEN }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          authorization="$(printf 'x-access-token:%s' "$SHARED_MODULE_TOKEN" | base64 -w 0)"
          echo "::add-mask::$authorization"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/HatFullOfData/hatfullofdata-hugo-shared.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization"
          hugo --environment production --gc --minify --baseURL "${PAGES_BASE_URL%/}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
